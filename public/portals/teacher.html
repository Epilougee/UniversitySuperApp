<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uni | Teacher Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap"
    rel="stylesheet">
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <style>
    :root {
      --bg-dark: #020408;
      --glass: rgba(255, 255, 255, .04);
      --glass-border: rgba(255, 255, 255, .1);
      --glass-hover: rgba(255, 255, 255, .1);
      --muted: rgba(255, 255, 255, .45);
      --muted2: rgba(255, 255, 255, .25);
      --gold: #e8a020;
      --gold2: #f5c842;
      --teal: #0d9488;
      --rose: #e11d48;
      --green: #10b981;
      --violet: #7c3aed;
      --admin: #6366f1;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body,
    html {
      width: 100%;
      height: 100%;
      background: #020408;
      font-family: 'Inter', -apple-system, sans-serif;
      color: #fff;
      overflow: hidden
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px
    }

    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, .02);
      border-radius: 99px
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, rgba(255, 255, 255, .25), rgba(255, 255, 255, .08));
      border-radius: 99px
    }

    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, rgba(255, 255, 255, .45), rgba(255, 255, 255, .18))
    }

    #chalkboard {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      contain: strict;
      transform: translateZ(0);
    }

    #mouse-glow {
      position: fixed;
      width: 500px;
      height: 500px;
      top: 0;
      left: 0;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      mix-blend-mode: screen;
      will-change: transform;
    }

    .chalk-icon {
      position: absolute;
      color: rgba(255, 255, 255, .35);
      pointer-events: none;
      filter: drop-shadow(0 0 5px rgba(255, 255, 255, .1));
      will-change: transform, color, opacity;
      transition: color .3s, opacity .3s
    }

    .app {
      position: relative;
      z-index: 10;
      display: flex;
      height: 100vh;
      width: 100%
    }

    /* SIDEBAR */
    .sidebar {
      width: 230px;
      flex-shrink: 0;
      background: var(--glass);
      border-right: 1px solid var(--glass-border);
      backdrop-filter: blur(30px);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative
    }

    .sidebar::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 200px;
      background: radial-gradient(ellipse at 50% 0%, rgba(99, 102, 241, .08), transparent);
      pointer-events: none
    }

    .sb-head {
      padding: 20px 18px 14px;
      border-bottom: 1px solid var(--glass-border);
      flex-shrink: 0
    }

    .sb-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -.5px;
      color: #fff
    }

    .sb-logo span {
      color: #a5b4fc
    }

    .sb-uni {
      font-size: .56rem;
      color: var(--muted2);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 2px
    }

    .sb-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(13, 148, 136, .15);
      border: 1px solid rgba(13, 148, 136, .25);
      color: #2dd4bf;
      font-size: .55rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 99px;
      margin-top: 6px;
      letter-spacing: .5px
    }

    .sb-profile {
      margin: 12px 10px;
      padding: 10px 12px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 10px
    }

    .sb-av {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      flex-shrink: 0;
      background: linear-gradient(135deg, #0d9488, #2dd4bf);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .75rem;
      font-weight: 800;
      color: #fff
    }

    .sb-name {
      font-size: .76rem;
      font-weight: 600
    }

    .sb-role {
      font-size: .6rem;
      color: var(--muted)
    }

    .sb-section {
      font-size: .54rem;
      color: var(--muted2);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 10px 18px 4px
    }

    .sb-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      cursor: pointer;
      transition: all .15s;
      border-left: 2px solid transparent;
      font-size: .76rem;
      font-weight: 500;
      color: var(--muted);
      position: relative
    }

    .sb-item:hover {
      background: rgba(255, 255, 255, .04);
      color: rgba(255, 255, 255, .85)
    }

    .sb-item.active {
      background: rgba(99, 102, 241, .1);
      color: #a5b4fc;
      border-left-color: #6366f1
    }

    .sb-ico {
      font-size: .82rem;
      width: 16px;
      text-align: center;
      flex-shrink: 0
    }

    .sb-bdg {
      margin-left: auto;
      background: var(--rose);
      color: #fff;
      font-size: .52rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 99px;
      min-width: 15px;
      text-align: center
    }

    .sb-foot {
      margin-top: auto;
      padding: 12px 18px;
      border-top: 1px solid var(--glass-border)
    }

    /* MAIN */
    .main {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden
    }

    .main::-webkit-scrollbar {
      width: 5px
    }

    .main::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, rgba(255, 255, 255, .25), rgba(255, 255, 255, .08));
      border-radius: 99px
    }

    /* TOPBAR */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(2, 4, 8, .85);
      backdrop-filter: blur(30px);
      border-bottom: 1px solid var(--glass-border);
      padding: 12px 22px;
      display: flex;
      align-items: center;
      gap: 12px
    }

    .tb-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-weight: 700;
      flex: 1
    }

    .tb-search {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 99px;
      padding: 6px 14px
    }

    .tb-search input {
      border: none;
      outline: none;
      background: transparent;
      font-family: 'Inter', sans-serif;
      font-size: .76rem;
      color: #fff;
      width: 140px
    }

    .tb-search input::placeholder {
      color: var(--muted2)
    }

    .nb {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: .82rem;
      position: relative;
      transition: .2s
    }

    .nb:hover {
      border-color: rgba(255, 255, 255, .3)
    }

    .ndot {
      position: absolute;
      top: -3px;
      right: -3px;
      min-width: 16px;
      height: 16px;
      background: var(--rose);
      border-radius: 99px;
      border: 1.5px solid #020408;
      font-size: .58rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 3px;
      color: #fff;
      transition: transform .2s
    }

    /* ── NOTIFICATION DROPDOWN ── */
    .notif-panel {
      position: fixed;
      top: 58px;
      right: 16px;
      width: 320px;
      max-height: 480px;
      background: rgba(10, 12, 24, .96);
      backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 18px;
      z-index: 999;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
      animation: panelIn .2s ease both;
      display: none
    }

    .notif-panel.open {
      display: flex;
      flex-direction: column
    }

    .notif-hdr {
      padding: 14px 16px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, .07);
      display: flex;
      align-items: center;
      justify-content: space-between
    }

    .notif-title {
      font-size: .82rem;
      font-weight: 700
    }

    .notif-list {
      overflow-y: auto;
      flex: 1
    }

    .notif-list::-webkit-scrollbar {
      width: 2px
    }

    .notif-item {
      padding: 11px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, .04);
      cursor: pointer;
      transition: background .15s;
      display: flex;
      gap: 10px;
      align-items: flex-start
    }

    .notif-item:hover {
      background: rgba(255, 255, 255, .04)
    }

    .notif-item.unread {
      background: rgba(99, 102, 241, .06)
    }

    .notif-ico {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .8rem;
      flex-shrink: 0;
      margin-top: 1px
    }

    .notif-body {
      flex: 1;
      min-width: 0
    }

    .notif-body-t {
      font-size: .76rem;
      font-weight: 600;
      margin-bottom: 2px;
      line-height: 1.35
    }

    .notif-body-s {
      font-size: .66rem;
      color: var(--muted)
    }

    .notif-unread-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--rose);
      flex-shrink: 0;
      margin-top: 6px
    }

    .notif-empty {
      padding: 30px 16px;
      text-align: center;
      color: var(--muted);
      font-size: .78rem
    }

    .notif-foot {
      padding: 10px 16px;
      border-top: 1px solid rgba(255, 255, 255, .06);
      text-align: center
    }

    @keyframes panelIn {
      from {
        opacity: 0;
        transform: translateY(-8px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .page {
      padding: 18px 22px 40px
    }

    /* CARDS */
    .gcard {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      backdrop-filter: blur(30px);
      padding: 16px 18px;
      transition: border-color .2s;
      position: relative;
      overflow: hidden
    }

    .gcard:hover {
      border-color: rgba(255, 255, 255, .18)
    }

    .stat {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(30px);
      transition: .2s
    }

    .stat:hover {
      border-color: rgba(255, 255, 255, .2);
      transform: translateY(-1px)
    }

    .stat-ico {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0
    }

    .stat-n {
      font-family: 'Playfair Display', serif;
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1
    }

    .stat-l {
      font-size: .65rem;
      color: var(--muted);
      margin-top: 2px
    }

    /* GRIDS */
    .g2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    .g3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px
    }

    .g4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px
    }

    /* UI */
    .sh {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px
    }

    .sh-t {
      font-family: 'Playfair Display', serif;
      font-size: .95rem;
      font-weight: 700
    }

    .div {
      height: 1px;
      background: rgba(255, 255, 255, .07);
      margin: .7rem 0
    }

    .pb {
      height: 4px;
      background: rgba(255, 255, 255, .08);
      border-radius: 99px;
      overflow: hidden
    }

    .pf {
      height: 100%;
      border-radius: 99px;
      transition: width 1s cubic-bezier(.4, 0, .2, 1)
    }

    .li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 6px;
      border-radius: 10px;
      transition: .15s;
      cursor: pointer
    }

    .li:hover {
      background: rgba(255, 255, 255, .04)
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 99px;
      font-size: .6rem;
      font-weight: 600
    }

    .t-gold {
      background: rgba(232, 160, 32, .15);
      color: var(--gold);
      border: 1px solid rgba(232, 160, 32, .25)
    }

    .t-teal {
      background: rgba(13, 148, 136, .15);
      color: #2dd4bf;
      border: 1px solid rgba(13, 148, 136, .25)
    }

    .t-rose {
      background: rgba(225, 29, 72, .15);
      color: #fb7185;
      border: 1px solid rgba(225, 29, 72, .25)
    }

    .t-green {
      background: rgba(16, 185, 129, .15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, .25)
    }

    .t-violet {
      background: rgba(124, 58, 237, .15);
      color: #a78bfa;
      border: 1px solid rgba(124, 58, 237, .25)
    }

    .t-white {
      background: rgba(255, 255, 255, .1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, .15)
    }

    .t-admin {
      background: rgba(99, 102, 241, .15);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, .25)
    }

    /* BUTTONS */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 13px;
      border-radius: 9px;
      border: none;
      font-family: 'Inter', sans-serif;
      font-size: .73rem;
      font-weight: 600;
      cursor: pointer;
      transition: .2s
    }

    .btn-teal {
      background: var(--teal);
      color: #fff
    }

    .btn-teal:hover {
      background: #0f766e
    }

    .btn-admin {
      background: var(--admin);
      color: #fff
    }

    .btn-admin:hover {
      background: #4f46e5
    }

    .btn-glass {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: #fff
    }

    .btn-glass:hover {
      background: var(--glass-hover)
    }

    .btn-white {
      background: #fff;
      color: #000
    }

    .btn-white:hover {
      background: rgba(255, 255, 255, .9)
    }

    .btn-rose {
      background: var(--rose);
      color: #fff
    }

    .btn-rose:hover {
      background: #be123c
    }

    .btn-gold {
      background: var(--gold);
      color: #000
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: .68rem
    }

    .btn-xs {
      padding: 3px 8px;
      font-size: .62rem
    }

    /* INPUTS */
    .inp {
      width: 100%;
      padding: 9px 12px;
      background: rgba(255, 255, 255, .04);
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 9px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: .8rem;
      outline: none;
      transition: .2s
    }

    .inp:focus {
      background: rgba(255, 255, 255, .07);
      border-color: rgba(99, 102, 241, .5);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, .1)
    }

    .inp::placeholder {
      color: var(--muted2)
    }

    .inp.error {
      border-color: #fb7185;
      background: rgba(251, 113, 133, .08)
    }

    .inp.success {
      border-color: #34d399;
      background: rgba(52, 211, 153, .08)
    }

    select.inp option {
      background: #0d1117;
      color: #fff
    }

    /* TABLE */
    .tbl {
      width: 100%;
      border-collapse: collapse;
      font-size: .76rem
    }

    .tbl th {
      padding: 9px 12px;
      text-align: left;
      color: var(--muted);
      font-weight: 600;
      font-size: .62rem;
      text-transform: uppercase;
      letter-spacing: .5px;
      border-bottom: 1px solid rgba(255, 255, 255, .08)
    }

    .tbl td {
      padding: 9px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, .04);
      vertical-align: middle
    }

    .tbl tr:hover td {
      background: rgba(255, 255, 255, .025)
    }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 999;
      background: rgba(255, 255, 255, .12);
      backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, .2);
      color: #fff;
      padding: 11px 16px;
      border-radius: 11px;
      font-size: .78rem;
      font-weight: 500;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .5);
      display: flex;
      align-items: center;
      gap: 8px;
      animation: fadeUp .3s ease
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    /* GLOBAL LOADER */
    .global-loader {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .4);
      backdrop-filter: blur(30px);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn .2s ease
    }

    .global-loader.hidden {
      display: none
    }

    .loader-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, .15);
      border-top-color: rgba(255, 255, 255, .8);
      border-radius: 50%;
      animation: spin 1s linear infinite
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .panel {
      animation: fadeUp .3s ease both
    }

    /* MODAL */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .6);
      backdrop-filter: blur(30px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .modal {
      background: #0d1117;
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 24px;
      width: 480px;
      max-width: 95vw;
      max-height: 85vh;
      overflow-y: auto
    }

    .modal-t {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px
    }

    .frow {
      margin-bottom: 12px
    }

    .flbl {
      font-size: .65rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .8px;
      margin-bottom: 4px;
      font-weight: 600
    }

    /* ATT GRID */
    .att-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 8px
    }

    .att-stu {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
      transition: .15s;
      text-align: center
    }

    .att-stu:hover {
      background: rgba(255, 255, 255, .1)
    }

    .att-stu.present {
      border-color: rgba(13, 148, 136, .5);
      background: rgba(13, 148, 136, .1)
    }

    .att-stu.absent {
      border-color: rgba(225, 29, 72, .5);
      background: rgba(225, 29, 72, .1)
    }
  </style>
</head>

<body>
  <div id="mouse-glow"></div>
  <div id="chalkboard"></div>
  <div class="app">
    <aside class="sidebar">
      <div class="sb-head">
        <div class="sb-logo">Un<span>i</span></div>
        <div class="sb-uni">Teacher Portal · 2025–26</div>
        <div class="sb-badge"><i class="fa-solid fa-chalkboard-user"></i> Faculty</div>
      </div>
      <div class="sb-profile">
        <div class="sb-av" id="sb-av">IK</div>
        <div>
          <div class="sb-name" id="sb-name">Indu Kumari</div>
          <div class="sb-role">Faculty</div>
        </div>
      </div>
      <div id="sb-nav">
        <div class="sb-section"><i class="fa-solid fa-star" style="margin-right:6px"></i>Overview</div>
        <div class="sb-item active" onclick="nav(this,'dashboard')"><span class="sb-ico"><i
              class="fa-solid fa-gauge-high"></i></span>Dashboard</div>

        <div class="sb-section"><i class="fa-solid fa-chalkboard-user" style="margin-right:6px"></i>Teaching</div>
        <div class="sb-item" onclick="nav(this,'attendance')"><span class="sb-ico"><i

    function initBadges() {
      Object.entries(BADGE_STATE).forEach(([section, count]) => {
        updateBadge(section, count);
      });
    }

    function updateBadge(section, count) {
      BADGE_STATE[section] = count;
      const items = document.querySelectorAll(`.sb-item[onclick*="'${section}'"]`);
      items.forEach(item => {
        let badge = item.querySelector('.sb-bdg');
        if (count > 0) {
          if (!badge) {
            badge = document.createElement('span');
            badge.className = 'sb-bdg';
            item.appendChild(badge);
          }
          badge.textContent = count;
          badge.style.display = 'inline-flex';
        } else {
          if (badge) {
            badge.style.display = 'none';
          }
        }
      });
    }

    async function clearSectionBadges(section, userId, userRole) {
      const count = BADGE_STATE[section] || 0;
      if (count === 0) return;

      try {
        const endpoint = section === 'messages' ? 'chat/read' : `${section}/read`;
        if (userId && userRole) {
          await fetch(`/api/${endpoint}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: userId, user_role: userRole })
          }).catch(() => null);
        }

        console.warn('Could not clear badges via API:', e.message);
      }

      updateBadge(section, 0);

    function renderMyStudents(list) {
      if (!list.length) return `<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--muted)">No students found</td></tr>`;
      return list.map(s => `<tr>

        <td style="font-weight:600;color:${s.marks.ia1 >= 14 ? '#2dd4bf' : '#fb7185'}">${s.marks.ia1}/20</td>

        <td>${tagHtml(s.att >= 75 ? 'Regular' : 'Defaulter', s.att >= 75 ? 'teal' : 'rose')}</td>
        <td><div style="display:flex;gap:4px"><button class="btn btn-glass btn-xs" onclick="showStudentProfile('${s.id}')"><i class="fa-solid fa-eye"></i></button><button class="btn btn-glass btn-xs" onclick="showStudentMarks('${s.id}')"><i class="fa-solid fa-chart-bar"></i></button></div></td>
      </tr>`).join('');
    }
    window.filterMyStudents = function () { const q = (document.getElementById('stu-q')?.value || '').toLowerCase(); const sec = document.getElementById('stu-sec')?.value || 'all'; const f2 = document.getElementById('stu-filter')?.value || 'all'; let list = MY_STUDENTS.filter(s => (sec === 'all' || s.sec === sec) && s.name.toLowerCase().includes(q)); if (f2 === 'def') list = list.filter(s => s.att < 75); if (f2 === 'exc') list = list.filter(s => s.att >= 85); const b = document.getElementById('stu-body'); if (b) b.innerHTML = renderMyStudents(list); };
    window.clearStudentForm = function () {
      document.getElementById('new-stu-id').value = '';
      document.getElementById('new-stu-name').value = '';
      document.getElementById('new-stu-email').value = '';
      document.getElementById('new-stu-phone').value = '';

    window.addNewStudent = async function () {
      try {
        const u = JSON.parse(sessionStorage.getItem('Uni_user') || 'null');
        const idEl = document.getElementById('new-stu-id');
        const nameEl = document.getElementById('new-stu-name');
        const emailEl = document.getElementById('new-stu-email');

        const id = idEl?.value?.trim();
        const name = nameEl?.value?.trim();
        const email = emailEl?.value?.trim();
        const phone = document.getElementById('new-stu-phone')?.value?.trim();
        const section = document.getElementById('new-stu-sec')?.value;
        const year = parseInt(document.getElementById('new-stu-year')?.value || '1');

        if (!id || !name || !email) {
          if (!id && idEl) idEl.style.borderColor = '#fb7185';
          if (!name && nameEl) nameEl.style.borderColor = '#fb7185';
          if (!email && emailEl) emailEl.style.borderColor = '#fb7185';
          showToast('❌ ID, Name, and Email required', 'error');
          return;
        }

        if (!email.includes('@')) {
          emailEl.style.borderColor = '#fb7185';
          showToast('❌ Invalid email address', 'error');
          return;
        }

        const btn = document.querySelector('[onclick*="addNewStudent"]');
        if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin" style="margin-right:4px"></i>Adding...'; }

        const r = await fetch(`${API_BASE}/admin/add-student`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, name, department: u.department, year, section, email, phone, cgpa: 0, attendance: 0, batch: '' })
        });
        const d = await r.json();
        if (d.ok) {
          MY_STUDENTS.push({ id, name, sec: section, att: 0, marks: { ia1: 0, ia2: 0, ia3: 0 }, cgpa: 0, status: 'Active', email, phone });
          showToast(`✅ ${name} added successfully!`);
          clearStudentForm();
          document.getElementById('page-content').innerHTML = pageStudents();
        } else {
          showToast('❌ ' + (d.message || 'Error adding student'), 'error');
        }
      } catch (e) { showToast('❌ Server error: ' + e.message, 'error'); } finally {
        const btn = document.querySelector('[onclick*="addNewStudent"]');
        if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-user-plus" style="margin-right:4px"></i>Add Student'; }
      }
    };

      modal(html);

    window.saveMarks = async function (classIdx, assessmentType) {
      try {
        const u = JSON.parse(sessionStorage.getItem('Uni_user') || 'null');
        const inputs = document.querySelectorAll('input[data-sid]');
        const entries = [];
        inputs.forEach(inp => {
          const val = parseInt(inp.value) || 0;
          if (val > 0) entries.push({ student_id: inp.dataset.sid, obtained: val });
        });
        if (entries.length === 0) { showToast('⚠️ Enter at least one mark', 'error'); return; }

        const btn = document.querySelector('.modal .btn-teal');
        if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin" style="margin-right:4px"></i>Saving...'; }

        const r = await fetch(`${API_BASE}/teacher/marks`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            teacher_id: u.id,
            class_id: parseInt(classIdx),
            assessment_type: assessmentType,
            max_marks: 20,
            entries,
            semester: 'Current'
          })
        });
        const d = await r.json();
        if (d.ok) {
          closeModal();
          showToast('✅ Marks saved & students notified!');
        } else {
          showToast('❌ ' + (d.message || 'Error saving marks'), 'error');
        }

        const btn = document.querySelector('.modal .btn-teal');
        if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-check" style="margin-right:4px"></i>Save Marks'; }
      }
    };

    window.showStudentProfile = function (id) { const s = MY_STUDENTS.find(x => x.id === id); if (!s) return; modal(`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-t"><i class="fa-solid fa-user-graduate" style="color:var(--admin);margin-right:8px"></i>${s.name}</div><div style="display:flex;gap:16px;margin-bottom:14px"><div style="width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--admin),#818cf8);display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:800">${s.name.split(' ').map(x => x[0]).join('')}</div><div><div style="font-weight:700">${s.name}</div><div style="font-size:.72rem;color:var(--muted)">${s.id} · Section ${s.sec}</div></div></div><div class="g2" style="margin-bottom:12px"><div class="gcard"><div style="font-size:.65rem;color:var(--muted);margin-bottom:4px">Attendance</div><div style="font-size:1.5rem;font-weight:800;color:${s.att >= 75 ? '#2dd4bf' : '#fb7185'}">${s.att}%</div></div><div class="gcard"><div style="font-size:.65rem;color:var(--muted);margin-bottom:4px">IA Avg</div><div style="font-size:1.5rem;font-weight:800;color:#a5b4fc">${((s.marks.ia1 + s.marks.ia2) / 2).toFixed(1)}/20</div></div><div class="gcard"><div style="font-size:.65rem;color:var(--muted);margin-bottom:4px">CGPA</div><div style="font-size:1.5rem;font-weight:800;color:#2dd4bf">${(s.cgpa || 7.5).toFixed(1)}</div></div></div><div style="margin-bottom:12px"><div class="sh-t" style="font-size:.78rem;margin-bottom:8px">Contact Info</div><div style="display:flex;flex-direction:column;gap:6px;font-size:.76rem;color:var(--muted)"><div><i class="fa-solid fa-envelope" style="margin-right:6px;color:#a5b4fc"></i>${s.email || '—'}</div><div><i class="fa-solid fa-phone" style="margin-right:6px;color:#2dd4bf"></i>${s.phone || '—'}</div></div></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-glass" onclick="closeModal()">Close</button><button class="btn btn-teal" onclick="closeModal();showToast('Message sent to ${s.name}')"><i class="fa-solid fa-comment" style="margin-right:4px"></i>Message</button></div></div></div>`); };
    window.showStudentMarks = function (id) { const s = MY_STUDENTS.find(x => x.id === id); if (!s) return; const avgIA = ((s.marks.ia1 || 0) + (s.marks.ia2 || 0)) / 2; modal(`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-t"><i class="fa-solid fa-chart-bar" style="color:var(--admin);margin-right:8px"></i>Marks — ${s.name}</div><div class="g2" style="margin-bottom:12px"><div class="gcard"><div style="font-size:.65rem;color:var(--muted);margin-bottom:4px">IA-1</div><div style="font-size:1.4rem;font-weight:800;color:#a5b4fc">${s.marks.ia1 || '—'}/20</div></div><div class="gcard"><div style="font-size:.65rem;color:var(--muted);margin-bottom:4px">IA-2</div><div style="font-size:1.4rem;font-weight:800;color:#2dd4bf">${s.marks.ia2 || '—'}/20</div></div><div class="gcard"><div style="font-size:.65rem;color:var(--muted);margin-bottom:4px">Average</div><div style="font-size:1.4rem;font-weight:800;color:var(--gold)">${isNaN(avgIA) ? '—' : avgIA.toFixed(1)}/20</div></div></div><div style="margin-bottom:12px"><div class="sh-t" style="font-size:.78rem;margin-bottom:8px;display:flex;justify-content:space-between"><span>Update Marks</span></div><div class="g2"><div class="frow"><div class="flbl">IA-1 (max 20)</div><input class="inp" type="number" min="0" max="20" id="mark-ia1" value="${s.marks.ia1 || 0}"></div><div class="frow"><div class="flbl">IA-2 (max 20)</div><input class="inp" type="number" min="0" max="20" id="mark-ia2" value="${s.marks.ia2 || 0}"></div></div></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-glass" onclick="closeModal()">Cancel</button><button class="btn btn-teal" onclick="updateStudentMarks('${s.id}');closeModal();showToast('Marks updated!')">Save</button></div></div></div>`); };

    window.postAnnouncement = async function () {
      try {
        const u = JSON.parse(sessionStorage.getItem('Uni_user') || 'null');
        const tEl = document.getElementById('ann-t');
        const bEl = document.getElementById('ann-b');
        const t = tEl?.value?.trim();
        const b = bEl?.value?.trim();
        const target = document.getElementById('ann-target')?.value;
        const urg = document.getElementById('ann-urg')?.value;

        if (!t || !b) {
          if (!t && tEl) tEl.style.borderColor = '#fb7185';
          if (!b && bEl) bEl.style.borderColor = '#fb7185';
          showToast('❌ Title and message required', 'error');
          return;
        }

        const btn = document.querySelector('[onclick*="postAnnouncement"]');
        if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin" style="margin-right:4px"></i>Posting...'; }

        const r = await fetch(`${API_BASE}/admin/announcements`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title: t,
            body: b,
            target: target || 'All',
            urgency: urg || 'Medium',
            author: u.name || u.id
          })
        });
        const d = await r.json();
        if (d.ok) {
          document.getElementById('ann-t').value = '';
          document.getElementById('ann-b').value = '';
          tEl.style.borderColor = '';
          bEl.style.borderColor = '';
          showToast('✅ Announcement posted & all students notified!');
          document.getElementById('page-content').innerHTML = pageAnnounce();
        } else {
          showToast('❌ ' + (d.message || 'Error posting'), 'error');
        }
      } catch (e) { showToast('❌ Server error: ' + e.message, 'error'); } finally {
        const btn = document.querySelector('[onclick*="postAnnouncement"]');
        if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-paper-plane" style="margin-right:4px"></i>Post'; }
      }
    };

    window.openChat = function (id) {
      activeChat = id; const c = CHATS_T.find(x => x.id === id);
      document.getElementById('chat-window').innerHTML = `
        <div style="padding:12px 16px;border-bottom:1px solid var(--glass-border);display:flex;align-items:center;gap:10px">
          <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--admin),#818cf8);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700">${c.name.split(' ').map(x => x[0]).slice(0, 2).join('')}</div>

        </div>`;
    };
    window.sendMsg = function (id) {
      const inp = document.getElementById('msg-inp');
      const txt = inp?.value?.trim();
      if (!txt) return;
      // Send via socket if available
      if (window._tchrSocket && window._tchrActiveRoom) {
        window._tchrSocket.emit('send_message', {
          room_id: window._tchrActiveRoom,
          sender_id: window._tchrMyId,
          sender_name: window._tchrMyName,
          sender_role: 'Teacher',
          text: txt
        });
      } else {
        // Fallback to local
        const c = CHATS_T.find(x => x.id === id);
        if (c) c.msgs.push({ me: true, text: txt });
        openChat(id);
      }
      inp.value = '';
    };

    /**
     * Create a new chat by selecting a contact
     * Shows a dialog with available contacts to start a conversation
     */
    window.tchrCreateNewChat = async function () {
      const u = JSON.parse(sessionStorage.getItem('Uni_user') || 'null');
      const API_BASE = '/api';

      try {
        const resp = await fetch(`${API_BASE}/chat/contacts/${encodeURIComponent(u.id)}/Teacher`);
        const data = await resp.json();
        const contacts = data.ok && data.contacts ? data.contacts : [];

        if (contacts.length === 0) {
          alert('No contacts available to chat with');
          return;
        }

        // Create contact selection dialog
        const dialogHtml = `
          <div class="modal-bg" id="new-chat-dialog" onclick="if(event.target.id==='new-chat-dialog') document.getElementById('new-chat-dialog').remove()">
            <div class="modal" style="width:420px;max-width:95vw">
              <div class="modal-t"><i class="fa-solid fa-pen-to-square" style="margin-right:8px;color:var(--teal)"></i>Start New Chat</div>
              <div style="border-bottom:1px solid rgba(255,255,255,0.08);padding:12px 16px;font-size:.7rem;color:var(--muted)">Select a contact to message</div>
              <div style="max-height:400px;overflow-y:auto;padding:8px 0">
                ${contacts.map((c, idx) => `
                  <div class="li" style="margin:0;padding:12px 16px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.04)" onclick="tchrSelectContactForChat(${idx})">
                    <div style="width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;color:${c.role === 'Teacher' ? '#2dd4bf' : c.role === 'Student' ? '#a78bfa' : '#6366f1'};font-size:.9rem;flex-shrink:0">
                      <i class="fa-solid ${c.role === 'Teacher' ? 'fa-chalkboard-user' : c.role === 'Student' ? 'fa-user-graduate' : 'fa-shield-halved'}"></i>
                    </div>
                    <div style="flex:1;">
                      <div style="font-weight:600;font-size:.8rem">${c.name}</div>
                      <div style="font-size:.68rem;color:var(--muted)">${c.role_label}</div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>`;

        document.body.insertAdjacentHTML('beforeend', dialogHtml);
      } catch (e) {
        console.error('Failed to load contacts:', e);
        alert('Error loading contacts');
      }
    };

    /**

      const API_BASE = '/api';

      try {
        // Get contacts again
        const resp = await fetch(`${API_BASE}/chat/contacts/${encodeURIComponent(u.id)}/Teacher`);

        const contacts = data.ok && data.contacts ? data.contacts : [];
        const contact = contacts[idx];

        if (!contact) return;

        // Remove dialog
        const dialog = document.getElementById('new-chat-dialog');
        if (dialog) dialog.remove();

        // Call backend to create/get chat
        const createResp = await fetch(`${API_BASE}/chat/create`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user1_id: u.id,
            user2_id: contact.id,
            user1_name: u.name,
            user2_name: contact.name,
            user1_role: 'Teacher',
            user2_role: contact.role
          })
        });
        const createData = await createResp.json();
        if (createData.ok) {
          showToast('✓ Chat opened successfully');

          if (!CHATS_T.find(x => x.id === contact.id)) {

          nav(document.querySelector('[onclick*="messages"]'), 'messages');
        }

        console.error('Chat create error:', e);
        showToast('Error creating chat', 'error');

    function animateChalk() {
      icons.forEach(icon => {
        const rect = icon.el.getBoundingClientRect();
        const iX = rect.left + rect.width / 2, iY = rect.top + rect.height / 2;
        const dx = mX - iX, dy = mY - iY, dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 200) {
          const angle = Math.atan2(dy, dx), force = (200 - dist) / 200;
          icon.vx -= Math.cos(angle) * force * 5; icon.vy -= Math.sin(angle) * force * 5;
          icon.el.style.color = 'rgba(180,180,255,.95)'; icon.el.style.opacity = '1';
          icon.el.style.filter = 'drop-shadow(0 0 12px rgba(99,102,241,.9))';

        icon.el.style.transform = `translate(${icon.x}px,${icon.y}px)`;
      });
      requestAnimationFrame(animateChalk);
    }

      } catch (e) {
        console.warn('Backend unavailable, using session data:', e.message);
      }

      /* Initialize Socket.IO for real-time chat */
      try {
        window._tchrSocket = io(window.location.origin);
        window._tchrActiveRoom = null;
        window._tchrSocket.on('receive_message', (data) => {
          if (data.room_id !== window._tchrActiveRoom) return;
          const msgsEl = document.getElementById('msgs');
          if (msgsEl) {
            const u2 = JSON.parse(sessionStorage.getItem('Uni_user') || 'null');
            msgsEl.innerHTML += `<div style="display:flex;justify-content:${data.sender_id === u2?.id ? 'flex-end' : 'flex-start'}"><div style="max-width:75%;background:${data.sender_id === u2?.id ? 'rgba(99,102,241,.25)' : 'rgba(255,255,255,.07)'};border:1px solid ${data.sender_id === u2?.id ? 'rgba(99,102,241,.3)' : 'rgba(255,255,255,.1)'};border-radius:12px;padding:8px 12px;font-size:.78rem;line-height:1.5">${data.text}</div></div>`;
            msgsEl.scrollTop = msgsEl.scrollHeight;
          }
        });
      } catch (e) {
        console.warn('Socket.IO not available:', e.message);
      }

      /* Load real contacts for teacher chat */
      const myId = window._tchrMyId || u.id;
      try {
        const cr = await fetch(`${API_BASE}/chat/contacts/${encodeURIComponent(myId)}/Teacher`);
        const cd = await cr.json();
        if (cd.ok && cd.contacts.length) {
          // Prepend real contacts to CHATS_T
          const realChats = cd.contacts.map((c, i) => ({
            id: 900 + i,
            contactId: c.id,
            name: c.name,
            role: `${c.role} · ${c.role_label}`,
            last: 'Start chatting...',
            time: '',
            unread: 0,
            msgs: [] // will be loaded on open
          }));
          // Merge with existing if not duplicate
          realChats.forEach(rc => {
            if (!CHATS_T.find(x => x.name === rc.name)) CHATS_T.unshift(rc);
          });
        }
      } catch (e) { /* silently skip */ }

      /* Override openChat to use Socket.IO */
      window.openChat = async function (id) {
        activeChat = id;
        const c = CHATS_T.find(x => x.id === id);
        if (!c) return;

        const contactId = c.contactId || c.id;
        const myId2 = window._tchrMyId || JSON.parse(sessionStorage.getItem('Uni_user') || '{}').id;
        const roomId = [myId2, contactId].sort().join('_');
        window._tchrActiveRoom = roomId;

        if (window._tchrSocket) window._tchrSocket.emit('join_room', roomId);

        // Render window
        document.getElementById('chat-window').innerHTML = `
          <div style="padding:12px 16px;border-bottom:1px solid var(--glass-border);display:flex;align-items:center;gap:10px">
            <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--admin),#818cf8);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700">${c.name.split(' ').map(x => x[0]).slice(0, 2).join('')}</div>
            <div><div style="font-weight:700;font-size:.84rem">${c.name}</div><div style="font-size:.62rem;color:var(--muted)">${c.role}</div></div>
          </div>
          <div style="flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px" id="msgs"><div style="text-align:center;color:var(--muted)"><i class="fa-solid fa-spinner fa-spin"></i></div></div>
          <div style="padding:10px 12px;border-top:1px solid var(--glass-border);display:flex;gap:8px">
            <input class="inp" id="msg-inp" placeholder="Type a message..." style="flex:1" onkeydown="if(event.key==='Enter')sendMsg(${id})">
            <button class="btn btn-teal btn-sm" onclick="sendMsg(${id})"><i class="fa-solid fa-paper-plane"></i></button>
          </div>`;

        // Load history from API
        try {
          const hr = await fetch(`${API_BASE}/chat/messages/${encodeURIComponent(roomId)}`);
          const hd = await hr.json();
          const msgsEl = document.getElementById('msgs');
          if (msgsEl && hd.ok) {
            if (hd.messages.length === 0) {
              msgsEl.innerHTML = '<div style="text-align:center;color:var(--muted);font-size:.75rem;padding:20px">No messages yet. Start the conversation!</div>';
            } else {
              const u3 = JSON.parse(sessionStorage.getItem('Uni_user') || 'null');
              msgsEl.innerHTML = hd.messages.map(m => `<div style="display:flex;justify-content:${m.sender_id === u3?.id ? 'flex-end' : 'flex-start'}"><div style="max-width:75%;background:${m.sender_id === u3?.id ? 'rgba(99,102,241,.25)' : 'rgba(255,255,255,.07)'};border:1px solid ${m.sender_id === u3?.id ? 'rgba(99,102,241,.3)' : 'rgba(255,255,255,.1)'};border-radius:12px;padding:8px 12px;font-size:.78rem;line-height:1.5">${m.text}<div style="font-size:.58rem;color:rgba(255,255,255,.3);margin-top:2px">${m.sender_name}</div></div></div>`).join('');
              msgsEl.scrollTop = msgsEl.scrollHeight;
            }
          } else {
            // Show fallback UI if API response not ok
            const msgsEl = document.getElementById('msgs');
            if (msgsEl && c.msgs?.length) {
              msgsEl.innerHTML = c.msgs.map(m => `<div style="display:flex;justify-content:${m.me ? 'flex-end' : 'flex-start'}"><div style="max-width:75%;background:${m.me ? 'rgba(99,102,241,.25)' : 'rgba(255,255,255,.07)'};border:1px solid ${m.me ? 'rgba(99,102,241,.3)' : 'rgba(255,255,255,.1)'};border-radius:12px;padding:8px 12px;font-size:.78rem">${m.text}</div></div>`).join('');
            }
          }
        } catch (e) {
          console.error('Chat load error:', e);
          // Show local messages as fallback
          const msgsEl = document.getElementById('msgs');
          if (msgsEl && c.msgs?.length) {
            msgsEl.innerHTML = c.msgs.map(m => `<div style="display:flex;justify-content:${m.me ? 'flex-end' : 'flex-start'}"><div style="max-width:75%;background:${m.me ? 'rgba(99,102,241,.25)' : 'rgba(255,255,255,.07)'};border:1px solid ${m.me ? 'rgba(99,102,241,.3)' : 'rgba(255,255,255,.1)'};border-radius:12px;padding:8px 12px;font-size:.78rem">${m.text}</div></div>`).join('');
            showToast('❌ Could not load message history', 'error');
          }
        }
      };

      /* Render dashboard after data is ready */
      document.getElementById('page-content').innerHTML = pageDashboard();
    })();

    function doLogout() { sessionStorage.removeItem('Uni_user'); window.top.location.href = '/'; }

    /* ── GLOBAL SEARCH ── */
    function globalSearch(q) {
      q = q.toLowerCase().trim();
      if (!q) {
        document.querySelectorAll('.li, tbody tr').forEach(el => el.style.display = '');
        return;
      }
      document.querySelectorAll('.li').forEach(el => {
        el.style.display = el.textContent.toLowerCase().includes(q) ? '' : 'none';
      });
      document.querySelectorAll('tbody tr').forEach(el => {
        el.style.display = el.textContent.toLowerCase().includes(q) ? '' : 'none';
      });
    }

    /* INIT – dashboard rendered by async auth above */
  </script>
</body>

</html>
