<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uni | Student Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap"
    rel="stylesheet">
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <style>
    :root {
      --bg-dark: #020408;
      --chalk-white: #ffffff;
      --glass: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-hover: rgba(255, 255, 255, 0.1);
      --accent: #6366f1;
      --aura-purple: #4c1d95;
      --muted: rgba(255, 255, 255, 0.45);
      --muted2: rgba(255, 255, 255, 0.25);
      --gold: #e8a020;
      --gold2: #f5c842;
      --teal: #0d9488;
      --rose: #e11d48;
      --green: #10b981;
      --violet: #7c3aed;
      --admin: #6366f1;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      background: #020408;
      background: radial-gradient(circle at 30% 20%, #0d1117 0%, #020408 100%);
      font-family: 'Inter', -apple-system, sans-serif;
      color: #fff;
      overflow: hidden;
    }

    /* ── CHALK BG ── */
    #chalkboard {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      contain: strict;
      transform: translateZ(0);
    }

    .chalk-icon {
      position: absolute;
      color: rgba(255, 255, 255, 0.35);
      pointer-events: none;
      filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.1));
      will-change: transform, color, opacity;
      transition: color 0.3s ease, opacity 0.3s ease;
    }

    /* ── MOUSE GLOW ── */
    #mouse-glow {
      position: fixed;
      width: 500px;
      height: 500px;
      top: 0;
      left: 0;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      mix-blend-mode: screen;
      will-change: transform;
    }

    /* ── LAYOUT ── */
    .app {
      position: relative;
      z-index: 10;
      display: flex;
      height: 100vh;
      width: 100%;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 220px;
      flex-shrink: 0;
      background: var(--glass);
      border-right: 1px solid var(--glass-border);
      backdrop-filter: blur(30px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .sb-nav {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .sb-nav::-webkit-scrollbar {
      width: 2px;
    }

    .sb-nav::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }

    .sidebar::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 200px;
      background: radial-gradient(ellipse at 50% 0%, rgba(255, 255, 255, 0.05), transparent);
      pointer-events: none;
    }

    .sb-head {
      padding: 24px 20px 16px;
      border-bottom: 1px solid var(--glass-border);
    }

    .sb-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
    }

    .sb-logo span {
      color: #a5b4fc;
    }

    .sb-uni {
      font-size: .58rem;
      color: var(--muted2);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .sb-profile {
      margin: 14px 12px;
      padding: 10px 12px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sb-av {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .8rem;
      font-weight: 800;
      color: #111;
    }

    .sb-name {
      font-size: .78rem;
      font-weight: 600;
      color: #fff;
    }

    .sb-role {
      font-size: .62rem;
      color: var(--muted);
    }

    .sb-section {
      font-size: .56rem;
      color: var(--muted2);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 12px 20px 4px;
    }

    .sb-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 20px;
      cursor: pointer;
      transition: all .15s;
      border-left: 2px solid transparent;
      font-size: .78rem;
      font-weight: 500;
      color: var(--muted);
      position: relative;
    }

    .sb-item:hover {
      background: rgba(255, 255, 255, 0.04);
      color: rgba(255, 255, 255, 0.85);
    }

    .sb-item.active {
      background: rgba(99, 102, 241, 0.1);
      color: #a5b4fc;
      border-left-color: #6366f1;
    }

    .sb-ico {
      font-size: .85rem;
      width: 16px;
      text-align: center;
      flex-shrink: 0;
    }

    .sb-bdg {
      margin-left: auto;
      background: var(--rose);
      color: #fff;
      font-size: .55rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 99px;
      min-width: 15px;
      text-align: center;
    }

    .sb-foot {
      margin-top: auto;
      padding: 14px 20px;
      border-top: 1px solid var(--glass-border);
    }

    /* ── MAIN ── */
    .main {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .main::-webkit-scrollbar {
      width: 5px;
    }

    .main::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.02);
      border-radius: 99px;
    }

    .main::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0.08));
      border-radius: 99px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .main::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0.18));
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(2, 4, 8, 0.8);
      backdrop-filter: blur(30px);
      border-bottom: 1px solid var(--glass-border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .tb-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      font-weight: 700;
      flex: 1;
    }

    .tb-search {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 99px;
      padding: 7px 14px;
    }

    .tb-search input {
      border: none;
      outline: none;
      background: transparent;
      font-family: 'Inter', sans-serif;
      font-size: .78rem;
      color: #fff;
      width: 140px;
    }

    .tb-search input::placeholder {
      color: var(--muted2);
    }

    .nb {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: .85rem;
      position: relative;
      transition: .2s;
    }

    .nb:hover {
      border-color: rgba(255, 255, 255, 0.3);
      background: var(--glass-hover);
    }

    .ndot {
      position: absolute;
      top: -3px;
      right: -3px;
      min-width: 16px;
      height: 16px;
      background: var(--rose);
      border-radius: 99px;
      border: 1.5px solid var(--bg-dark);
      font-size: .58rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 3px;
      color: #fff;
      transition: transform .2s;
    }

    /* ── NOTIFICATION DROPDOWN ── */
    .notif-panel {
      position: fixed;
      top: 58px;
      right: 16px;
      width: 320px;
      max-height: 480px;
      background: rgba(10, 12, 24, 0.96);
      backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      z-index: 999;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      animation: panelIn .2s ease both;
      display: none;
    }

    .notif-panel.open {
      display: flex;
      flex-direction: column;
    }

    .notif-hdr {
      padding: 14px 16px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .notif-title {
      font-size: .82rem;
      font-weight: 700;
    }

    .notif-list {
      overflow-y: auto;
      flex: 1;
    }

    .notif-list::-webkit-scrollbar {
      width: 2px;
    }

    .notif-item {
      padding: 11px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      cursor: pointer;
      transition: background .15s;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .notif-item:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .notif-item.unread {
      background: rgba(99, 102, 241, 0.06);
    }

    .notif-ico {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .8rem;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .notif-body {
      flex: 1;
      min-width: 0;
    }

    .notif-body-t {
      font-size: .76rem;
      font-weight: 600;
      margin-bottom: 2px;
      line-height: 1.35;
    }

    .notif-body-s {
      font-size: .66rem;
      color: var(--muted);
    }

    .notif-unread-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
      margin-top: 6px;
    }

    .notif-empty {
      padding: 30px 16px;
      text-align: center;
      color: var(--muted);
      font-size: .78rem;
    }

    .notif-foot {
      padding: 10px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      text-align: center;
    }

    .page {
      padding: 20px 24px 40px;
    }

    /* ── GLASS CARD ── */
    .gcard {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      backdrop-filter: blur(30px);
      padding: 18px 20px;
      transition: border-color .2s, transform .2s;
      position: relative;
      overflow: hidden;
    }

    .gcard:hover {
      border-color: rgba(255, 255, 255, 0.18);
    }

    /* ── GRID ── */
    .g2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .g3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .g4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    /* ── STAT CARD ── */
    .stat {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      backdrop-filter: blur(30px);
      transition: .2s;
    }

    .stat:hover {
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    .stat-ico {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .stat-n {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 700;
      line-height: 1;
    }

    .stat-l {
      font-size: .68rem;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ── HERO BANNER ── */
    .hero {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.03) 100%);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 22px 24px;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(20px);
      margin-bottom: 14px;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -40px;
      right: -40px;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(232, 160, 32, 0.12), transparent 70%);
      pointer-events: none;
    }

    .hero::after {
      content: 'Uni';
      position: absolute;
      bottom: -24px;
      right: 16px;
      font-family: 'Playfair Display', serif;
      font-size: 5rem;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.03);
      pointer-events: none;
    }

    .hero-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.55rem;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .hero-sub {
      font-size: .75rem;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .hero-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .htag {
      font-size: .65rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.7);
    }

    .htag.gold {
      background: rgba(232, 160, 32, 0.12);
      border-color: rgba(232, 160, 32, 0.25);
      color: var(--gold);
    }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 10px;
      border: none;
      font-family: 'Inter', sans-serif;
      font-size: .75rem;
      font-weight: 600;
      cursor: pointer;
      transition: .2s;
    }

    .btn-white {
      background: #fff;
      color: #000;
    }

    .btn-white:hover {
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
    }

    .btn-glass {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: #fff;
    }

    .btn-glass:hover {
      background: var(--glass-hover);
    }

    .btn-gold {
      background: var(--gold);
      color: #000;
    }

    .btn-gold:hover {
      background: var(--gold2);
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: .7rem;
    }

    .btn-xs {
      padding: 3px 8px;
      font-size: .65rem;
    }

    /* ── INPUTS ── */
    .inp {
      width: 100%;
      padding: 10px 13px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: .82rem;
      outline: none;
      transition: .2s;
    }

    .inp:focus {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .inp::placeholder {
      color: var(--muted2);
    }

    textarea.inp {
      resize: vertical;
      min-height: 72px;
    }

    /* ── TAGS ── */
    .tag {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 99px;
      font-size: .62rem;
      font-weight: 600;
    }

    .t-gold {
      background: rgba(232, 160, 32, 0.15);
      color: var(--gold);
      border: 1px solid rgba(232, 160, 32, 0.25);
    }

    .t-teal {
      background: rgba(13, 148, 136, 0.15);
      color: #2dd4bf;
      border: 1px solid rgba(13, 148, 136, 0.25);
    }

    .t-rose {
      background: rgba(225, 29, 72, 0.15);
      color: #fb7185;
      border: 1px solid rgba(225, 29, 72, 0.25);
    }

    .t-green {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    .t-violet {
      background: rgba(124, 58, 237, 0.15);
      color: #a78bfa;
      border: 1px solid rgba(124, 58, 237, 0.25);
    }

    .t-white {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* ── SECTION HEADER ── */
    .sh {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .sh-t {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-weight: 700;
    }

    /* ── DIVIDER ── */
    .div {
      height: 1px;
      background: rgba(255, 255, 255, 0.07);
      margin: .8rem 0;
    }

    /* ── PROGRESS BAR ── */
    .pb {
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
    }

    .pf {
      height: 100%;
      border-radius: 99px;
      transition: width 1s cubic-bezier(.4, 0, .2, 1);
    }

    /* ── LIST ITEM ── */
    .li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 8px;
      border-radius: 10px;
      transition: .15s;
      cursor: pointer;
    }

    .li:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    /* ── ATTENDANCE ── */
    .att-wrap {
      position: relative;
      width: 80px;
      height: 80px;
      flex-shrink: 0;
    }

    .att-svg {
      width: 80px;
      height: 80px;
      transform: rotate(-90deg);
    }

    .att-ring-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 5;
    }

    .att-ring-fill {
      fill: none;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-dasharray: 219.9;
      transition: stroke-dashoffset 1.2s cubic-bezier(.4, 0, .2, 1);
    }

    .att-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .att-pct {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1;
    }

    .att-lbl {
      font-size: .5rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    /* ── CHAT ── */
    .chat-layout {
      display: flex;
      height: calc(100vh - 130px);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      overflow: hidden;
      background: var(--glass);
      backdrop-filter: blur(20px);
    }

    .chat-left {
      width: 220px;
      flex-shrink: 0;
      border-right: 1px solid var(--glass-border);
      overflow-y: auto;
    }

    .chat-left::-webkit-scrollbar {
      width: 2px;
    }

    .chat-si {
      padding: 10px 12px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      transition: .15s;
    }

    .chat-si:hover,
    .chat-si.active {
      background: rgba(255, 255, 255, 0.05);
    }

    .chat-si.active {
      border-left: 2px solid rgba(255, 255, 255, 0.3);
    }

    .chat-sn {
      font-size: .78rem;
      font-weight: 600;
    }

    .chat-sp {
      font-size: .68rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .chat-hdr {
      padding: 12px 16px;
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chat-msgs {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-msgs::-webkit-scrollbar {
      width: 2px;
    }

    .cmsg {
      max-width: 68%;
      padding: 9px 13px;
      border-radius: 12px;
      font-size: .8rem;
      line-height: 1.55;
    }

    .cm-me {
      align-self: flex-end;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 12px 12px 2px 12px;
    }

    .cm-them {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      border-radius: 12px 12px 12px 2px;
    }

    .chat-inp {
      padding: 10px 12px;
      border-top: 1px solid var(--glass-border);
      display: flex;
      gap: 8px;
    }

    /* ── TIMETABLE ── */
    .tt {
      display: grid;
      grid-template-columns: 52px repeat(6, 1fr);
      gap: 2px;
      font-size: .68rem;
    }

    .tt-h {
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.7);
      padding: 6px 4px;
      text-align: center;
      border-radius: 4px;
      font-weight: 600;
      font-size: .62rem;
    }

    .tt-t {
      color: var(--muted);
      padding: 4px 4px;
      text-align: right;
      font-size: .6rem;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .tt-c {
      padding: 3px 3px;
      border-radius: 5px;
      min-height: 44px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .tt-e {
      border: 1px dashed rgba(255, 255, 255, 0.06);
    }

    .tt-s {
      color: #fff;
      font-weight: 600;
      font-size: .62rem;
      padding: 4px 5px;
    }

    /* ── MARKET CARD ── */
    .mkt-c {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      overflow: hidden;
      transition: .2s;
      cursor: pointer;
      backdrop-filter: blur(20px);
    }

    .mkt-c:hover {
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    .mkt-img {
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      background: rgba(255, 255, 255, 0.03);
    }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 999;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: .8rem;
      font-weight: 500;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 8px;
      animation: fadeUp .3s ease;
    }

    /* ── MODAL ── */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      backdrop-filter: blur(30px);
      animation: fadeIn .2s ease;
    }

    .modal {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      backdrop-filter: blur(30px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      max-width: 90vw;
      max-height: 90vh;
      overflow-y: auto;
      animation: modalSlide .3s cubic-bezier(.4, 0, .2, 1);
    }

    @keyframes modalSlide {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .modal-t {
      padding: 20px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-size: .95rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .modal-c {
      padding: 20px 24px;
      max-height: calc(90vh - 120px);
      overflow-y: auto;
    }

    .modal-b {
      padding: 16px 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes panelIn {
      from {
        opacity: 0;
        transform: translateY(10px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    /* ── GLOBAL LOADER ── */
    .global-loader {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      backdrop-filter: blur(30px);
      animation: fadeIn .2s ease;
    }

    .global-loader.hidden {
      display: none;
    }

    .loader-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top: 4px solid #a5b4fc;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    /* ── FORM VALIDATION ── */
    .form-error {
      color: #fb7185;
      font-size: .7rem;
      margin-top: 3px;
      min-height: 16px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .inp.error {
      border-color: #fb7185 !important;
      background: rgba(251, 113, 133, 0.05) !important;
    }

    .inp.success {
      border-color: #10b981 !important;
      background: rgba(16, 185, 129, 0.05) !important;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      pointer-events: none;
    }

    .btn.loading {
      position: relative;
      color: transparent;
    }

    .btn.loading::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      top: 50%;
      left: 50%;
      margin-left: -7px;
      margin-top: -7px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    .panel {
      animation: panelIn .3s ease both;
    }

    /* ── PANELS ── */
    #panel-ai {
      display: flex;
      flex-direction: column;
      height: calc(100vh-115px);
    }

    .ai-msgs {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 10px;
    }

    .ai-msgs::-webkit-scrollbar {
      width: 2px;
    }

    /* ── SUBJECT EXPAND ── */
    .subj-c {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      overflow: hidden;
      transition: .2s;
      margin-bottom: 8px;
      backdrop-filter: blur(20px);
    }

    .subj-c:hover {
      border-color: rgba(255, 255, 255, 0.18);
    }

    .subj-head {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      user-select: none;
    }

    .subj-arrow {
      color: var(--muted);
      font-size: .9rem;
      margin-left: auto;
      transition: .3s;
    }

    .subj-c.open .subj-arrow {
      transform: rotate(180deg);
    }

    .subj-detail {
      max-height: 0;
      overflow: hidden;
      transition: max-height .4s cubic-bezier(.4, 0, .2, 1);
    }

    .subj-c.open .subj-detail {
      max-height: 320px;
    }

    .detail-inner {
      padding: 16px 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* ── CAL GRID ── */
    .cal-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      margin-top: 8px;
    }

    .cal-d {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .55rem;
      font-weight: 600;
    }

    .cal-p {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
    }

    .cal-a {
      background: rgba(225, 29, 72, 0.2);
      color: #fb7185;
    }

    /* ── POSTS ── */
    .post {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 10px;
      backdrop-filter: blur(20px);
    }

    .post:hover {
      border-color: rgba(255, 255, 255, 0.16);
    }

    /* ── EVENT CARD ── */
    .ev-c {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      overflow: hidden;
      transition: .2s;
      backdrop-filter: blur(20px);
    }

    .ev-c:hover {
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    /* ── BOOK CARD ── */
    .bk-c {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: .2s;
      backdrop-filter: blur(20px);
    }

    .bk-c:hover {
      border-color: rgba(255, 255, 255, 0.18);
    }

    /* ── SCROLLBAR GLOBAL ── */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.02);
      border-radius: 99px;
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0.08));
      border-radius: 99px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: background .2s;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0.18));
    }

    @media(max-width:768px) {
      .sidebar {
        display: none
      }

      .g4 {
        grid-template-columns: 1fr 1fr
      }

      .g3 {
        grid-template-columns: 1fr 1fr
      }

      .chat-left {
        display: none
      }
    }
  </style>
</head>

            oninput="globalSearch(this.value)"></div>

          <button class="btn btn-glass btn-xs" onclick="markAllRead()">Read all</button>

  <!-- ─── GLOBAL LOADER ─── -->

    <div class="loader-spinner"></div>
  </div>

  <script>
    /* ── STATIC FALLBACK DATA (used when backend has no classes for new students) ── */
    let SUBJECTS = [
      { name: "Data Structures & Algorithms", code: "CSE301", teacher: "Prof. R. Sharma", att: 78, total: 48, present: 37, color: "#0d9488" },
      { name: "Computer Networks", code: "CSE302", teacher: "Prof. S. Kulkarni", att: 91, total: 44, present: 40, color: "#7c3aed" },
      { name: "Database Management Systems", code: "CSE303", teacher: "Prof. A. Joshi", att: 64, total: 42, present: 27, color: "#e8a020" },
      { name: "Operating Systems", code: "CSE304", teacher: "Prof. M. Gupta", att: 86, total: 45, present: 39, color: "#c41e3a" },
      { name: "Software Engineering", code: "CSE305", teacher: "Prof. P. Rao", att: 90, total: 38, present: 34, color: "#10b981" },
    ];
    let ASSIGNMENTS = [
      { id: 1, sub: "Data Structures", title: "Implement Red-Black Tree", description: "Implement a complete Red-Black tree data structure with insertion, deletion, and balancing operations. Include visualization if possible.", due: "Mar 15", status: "Pending", priority: "High", assignedBy: "Prof. Rajesh Kumar", submissionLink: "" },
      { id: 2, sub: "DBMS", title: "ER Diagram — University System", description: "Create an Entity-Relationship diagram for a comprehensive university management system including students, teachers, courses, and inventory.", due: "Mar 18", status: "Submitted", priority: "Medium", assignedBy: "Dr. Priya Singh", submissionLink: "https://drive.google.com/..." },
      { id: 3, sub: "Computer Networks", title: "Socket Programming — Multi-client Chat", description: "Develop a multi-client chat application using socket programming. Must support real-time messaging across multiple clients.", due: "Mar 21", status: "Pending", priority: "High", assignedBy: "Prof. Arun Patel", submissionLink: "" },
      { id: 4, sub: "Operating Systems", title: "CPU Scheduling Simulation", description: "Simulate and compare different CPU scheduling algorithms (FCFS, SJF, Round Robin, Priority). Analyze and report performance metrics.", due: "Mar 24", status: "Pending", priority: "Medium", assignedBy: "Dr. Sunil Kumar", submissionLink: "" },
      { id: 5, sub: "Software Engineering", title: "UML Diagrams — E-Commerce App", description: "Design complete UML diagrams including use case, class, sequence, and activity diagrams for an e-commerce platform.", due: "Mar 28", status: "Submitted", priority: "Low", assignedBy: "Prof. Meera Sharma", submissionLink: "https://drive.google.com/..." },
    ];
    const ANNOUNCEMENTS = [
      { title: "End Semester Exams — May 5–20", body: "ESE schedule for all UG/PG programs released. Hall tickets 1 week prior. Check portal for subject-wise dates.", date: "Mar 10", tag: "Exam", tt: "rose", author: "Exam Cell, Uni" },
      { title: "Ideathon 2026 — Register Now!", body: "Uni's flagship innovation contest. Teams of 3–5. Cash prizes ₹1,50,000. Deadline March 20.", date: "Mar 9", tag: "Event", tt: "teal", author: "Innovation Cell" },
      { title: "Central Library — 350 New Titles", body: "New books across Engineering, MBA, Design. Available at counter or via Library App.", date: "Mar 8", tag: "Library", tt: "gold", author: "Central Library" },
      { title: "Campus Network Maintenance — Mar 16", body: "Network down 12AM–4AM. Offline chat features will still work.", date: "Mar 7", tag: "Notice", tt: "white", author: "IT Dept." },
      { title: "Sports Championship Trials — Mar 22", body: "Cricket, Badminton, Athletics. Register at Sports Block before March 19.", date: "Mar 6", tag: "Sports", tt: "green", author: "Sports Dept." },
    ];

    /* ── NOTIFICATIONS SYSTEM ── */
    let NOTIFICATIONS = [];
    let _stuUser = null;

    // Fetch notifications from backend
    async function loadNotifications() {
      try {
        const user = JSON.parse(sessionStorage.getItem('Uni_user') || '{}');
        if (!user.id || !user.role) return;
        _stuUser = user;

        const resp = await fetch(`/api/notifications/${user.id}/${user.role}`);
        const data = await resp.json();
        if (data.ok && data.notifications) {
          NOTIFICATIONS = data.notifications.map(n => ({
            id: n.id,
            title: n.title,
            sub: n.body || 'Notification',
            icon: 'fa-bell',
            color: 'rgba(99,102,241,0.15)',
            iconColor: '#a5b4fc',
            read: n.read_status === 1,
            created_at: n.created_at,
            category: n.category
          }));
        }
        updateNotifBadge();
        renderNotifList();
      } catch (e) {
        console.error('Failed to load notifications:', e);
      }
    }

    function getUnreadCount() {
      return NOTIFICATIONS.filter(n => !n.read).length;
    }

    function updateNotifBadge() {
      const cnt = getUnreadCount();
      const dot = document.getElementById('notif-count');
      if (!dot) return;
      if (cnt > 0) {
        dot.style.display = 'flex';
        dot.textContent = cnt;
      } else {
        dot.style.display = 'none';
      }
    }

    function renderNotifList() {
      const list = document.getElementById('notif-list');
      if (!list) return;
      if (NOTIFICATIONS.length === 0) {
        list.innerHTML = '<div class="notif-empty"><i class="fa-solid fa-bell-slash" style="font-size:1.8rem;display:block;margin-bottom:8px;opacity:.3"></i>All caught up!</div>';
        return;
      }
      const unreadCount = getUnreadCount();
      list.innerHTML = `<div style="padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.08);font-size:.7rem;color:var(--muted);display:flex;justify-content:space-between;align-items:center">
        <span>${unreadCount} unread notification${unreadCount !== 1 ? 's' : ''}</span>
        ${unreadCount > 0 ? `<button class="btn btn-glass btn-xs" onclick="markAllRead()" style="padding:3px 8px;font-size:.62rem"><i class="fa-solid fa-check-double" style="margin-right:3px"></i>Mark all read</button>` : ''}
      </div>` + NOTIFICATIONS.map((n, i) => `
        <div class="notif-item ${n.read ? '' : 'unread'}" onclick="readNotif(${i})" style="cursor:pointer;transition:.2s">
          <div class="notif-ico" style="background:${n.color};color:${n.iconColor}">
            <i class="fa-solid ${n.icon}"></i>
          </div>
          <div class="notif-body">
            <div class="notif-body-t">${n.title}</div>
            <div class="notif-body-s">${n.sub}</div>
          </div>
          ${!n.read ? '<div class="notif-unread-dot"></div>' : ''}
        </div>`).join('');
    }

    // Close notifications when clicking outside
    document.addEventListener('click', () => {
      const p = document.getElementById('notif-panel');
      if (p && p.classList.contains('open')) p.classList.remove('open');
    });

    window.toggleNotifications = function (e) {
      if (e) e.stopPropagation();
      const panel = document.getElementById('notif-panel');
      const isOpen = panel.classList.contains('open');
      if (isOpen) {
        panel.classList.remove('open');
      } else {
        panel.classList.add('open');
        renderNotifList();
      }
    };

    /**
     * Mark a single notification as read via API
     * Updates the notification and refreshes the UI
     */
    window.readNotif = async function (i) {
      const notif = NOTIFICATIONS[i];
      if (notif.read) return; // Already read

      try {
        const resp = await fetch(`/api/notifications/read/${notif.id}`, {
          method: 'PUT',

    function initBadges() {

    /**
     * Update badge count for a section
     * @param {string} section - Section ID (announcements, chat, assignments, etc.)
     * @param {number} count - Badge count (0 = hide badge)
     */
    function updateBadge(section, count) {
      BADGE_STATE[section] = count;
      const items = document.querySelectorAll(`.sb-item[onclick*="'${section}'"]`);
      items.forEach(item => {
        let badge = item.querySelector('.sb-bdg');
        if (count > 0) {
          if (!badge) {
            badge = document.createElement('span');
            badge.className = 'sb-bdg';
            item.appendChild(badge);
          }
          badge.textContent = count;
          badge.style.display = 'inline-flex';
        } else {
          if (badge) {
            badge.style.display = 'none';
          }
        }
      });
    }

    /**
     * Clear badges for a section when user opens it
     * @param {string} section - Section ID to clear badges for
     */
    async function clearSectionBadges(section, userId, userRole) {
      const count = BADGE_STATE[section] || 0;
      if (count === 0) return; // Already cleared

      // Call backend API to mark items as read
      try {
        const endpoint = section === 'announcements' ? 'announcements/read'
          : section === 'chat' ? 'chat/read'
            : section === 'assignments' ? 'assignments/read'
              : null;

        if (endpoint && userId && userRole) {
          const resp = await fetch(`/api/${endpoint}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: userId, user_role: userRole })
          }).catch(() => null); // Fail silently if API not ready
        }
      } catch (e) {
        console.warn('Could not clear badges via API:', e.message);
      }

      // Update UI immediately
      updateBadge(section, 0);
    }

    window.saveStudentProfile = async function () {
      try {
        const u = JSON.parse(sessionStorage.getItem('Uni_user') || 'null');
        if (!u) { showError('Not logged in'); return; }

        const nameEl = document.getElementById('pm-name');
        const emailEl = document.getElementById('pm-email');
        const phoneEl = document.getElementById('pm-phone');

        const name = nameEl?.value?.trim();
        const phone = phoneEl?.value?.trim();
        const email = emailEl?.value?.trim();

        if (!name || !email) {
          if (!name) showError('Name is required', nameEl);
          if (!email) showError('Email is required', emailEl);
          return;
        }

        if (!email.includes('@')) {
          showError('Invalid email address', emailEl);
          return;
        }

        showLoader();
        const btn = document.querySelector('.modal button[onclick*="saveStudentProfile"]');
        if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }

        const r = await fetch(`${API_BASE_URL}/student/${encodeURIComponent(u.id)}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, phone, email })
        });

        const d = await r.json();
        if (d.ok) {
          window.DB_STUDENT = { ...window.DB_STUDENT, name, phone, email };
          sessionStorage.setItem('Uni_user', JSON.stringify({ ...u, name, phone, email }));
          closeModal();
          showToast('✅ Profile updated successfully!');
          navTo('dashboard');
        } else {
          showError(d.message || 'Error updating profile');
        }
      } catch (e) {
        showError('Server error: ' + e.message);
      } finally {
        hideLoader();
        const btn = document.querySelector('.modal button[onclick*="saveStudentProfile"]');
        if (btn) { btn.disabled = false; btn.textContent = 'Save Changes'; }
      }
    };

    window.markAttendanceWithOTP = function () {
      const classIdx = document.getElementById('att-class-sel')?.value;
      if (!classIdx) {
        showToast('Please select a class', 'error');
        return;
      }
      const subj = SUBJECTS[classIdx];
      modal(`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
        <div class="modal-t"><i class="fa-solid fa-key" style="color:var(--admin);margin-right:8px"></i>Mark Attendance — ${subj.name}</div>
        <div class="gcard" style="margin-bottom:14px;background:rgba(13,148,136,.08);border:1px solid rgba(13,148,136,.2)">
          <div style="font-size:.72rem;color:#2dd4bf;margin-bottom:8px"><i class="fa-solid fa-location-dot" style="margin-right:6px"></i>Location Status</div>
          <div id="geo-status" style="font-size:.76rem;font-weight:600;color:var(--muted)">Checking your location...</div>
          <div id="geo-detail" style="font-size:.65rem;color:var(--muted);margin-top:6px;display:none"></div>
        </div>
        <div class="frow"><div class="flbl">Enter OTP (6 digits)</div><input class="inp" id="otp-inp" maxlength="6" placeholder="000000" type="text" inputmode="numeric" onkeyup="this.value=this.value.replace(/[^0-9]/g,'')" autofocus></div>
        <div id="otp-timer" style="text-align:center;font-size:.7rem;color:var(--muted);margin-bottom:10px">OTP expires in: <span id="timer-sec">300</span>s</div>
        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button class="btn btn-glass" onclick="closeModal()">Cancel</button>
          <button class="btn btn-teal" onclick="verifyOTPAndMark('${classIdx}')"><i class="fa-solid fa-check" style="margin-right:4px"></i>Verify & Mark</button>
        </div>
      </div></div>`);

      // Start geofencing check
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          const acc = pos.coords.accuracy;
          const classroom = { lat: 18.5905, lng: 73.8167 }; // Sample coordinates for Pune
          const dist = Math.round(Math.sqrt(Math.pow(lat - classroom.lat, 2) + Math.pow(lng - classroom.lng, 2)) * 111000); // meters

          const statusEl = document.getElementById('geo-status');
          const detailEl = document.getElementById('geo-detail');
          if (dist < 200) {
            statusEl.innerHTML = '<i class="fa-solid fa-circle-check" style="color:#2dd4bf;margin-right:6px"></i>You are inside the classroom area ✓';
            statusEl.style.color = '#2dd4bf';
            detailEl.innerHTML = `Distance: ${dist}m (Allowed: 200m) | Accuracy: ±${Math.round(acc)}m`;
            detailEl.style.display = 'block';
            window._geoVerified = true;
          } else {
            statusEl.innerHTML = '<i class="fa-solid fa-circle-xmark" style="color:#fb7185;margin-right:6px"></i>You are outside the classroom area';
            statusEl.style.color = '#fb7185';
            detailEl.innerHTML = `Distance: ${dist}m (${dist - 200}m outside limits) | Max distance: 200m`;
            detailEl.style.display = 'block';
            detailEl.style.color = '#fb7185';
            window._geoVerified = false;
          }
        }, err => {
          document.getElementById('geo-status').innerHTML = '<i class="fa-solid fa-exclamation-triangle" style="color:var(--gold);margin-right:6px"></i>Enable location to verify attendance';
          document.getElementById('geo-status').style.color = 'var(--gold)';
          window._geoVerified = false;
        });
      }

      // Timer
      let remaining = 300;
      const timerInterval = setInterval(() => {
        remaining--;
        document.getElementById('timer-sec').textContent = remaining;
        if (remaining <= 0) {
          clearInterval(timerInterval);
          showToast('OTP expired', 'error');
          closeModal();
        }
      }, 1000);
    };

    window.verifyOTPAndMark = async function (clsIdx) {
      const otpEl = document.getElementById('otp-inp');
      const otp = otpEl?.value?.trim();
      if (!otp || otp.length !== 6) {
        showError('Please enter valid 6-digit OTP', otpEl);
        return;
      }

      if (!window._geoVerified) {
        showError('You must be within 200m of classroom to mark attendance');
        return;
      }

      try {
        const u = JSON.parse(sessionStorage.getItem('Uni_user') || 'null');
        const subj = SUBJECTS[clsIdx];

        // Get current position for backend verification
        if (!navigator.geolocation) {
          showError('Geolocation not available on this device');
          return;
        }

        showLoader();
        const btn = document.querySelector('.modal .btn-success, .modal .btn-teal');
        if (btn) { btn.disabled = true; }

        navigator.geolocation.getCurrentPosition(async pos => {
          try {
            // Get class_id from SUBJECTS
            const classId = subj.id || clsIdx;

            const attResp = await fetch(`${API_BASE_URL}/attendance/verify-otp`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                otp,
                student_id: u.id,
                class_id: classId,
                lat: pos.coords.latitude,
                lng: pos.coords.longitude
              })
            });

            const data = await attResp.json();
            if (data.ok) {
              showToast('✅ Attendance marked successfully!');
              closeModal();
              // Refresh attendance data from backend
              const freshAtt = await fetch(`${API_BASE_URL}/student/${encodeURIComponent(u.id)}/attendance`);
              const freshData = await freshAtt.json();
              if (freshData.ok) {
                window.DB_ATTENDANCE = freshData.classes;
              }
              document.getElementById('page-content').innerHTML = pageAttendance();
              bindAttendance();
            } else {
              showError(data.message || 'OTP verification failed');
            }
          } catch (e) {
            showError('Server error: ' + e.message);
          } finally {
            hideLoader();
            if (btn) { btn.disabled = false; }
          }
        }, err => {
          hideLoader();
          showError('Could not get location. Please allow location access.');
          if (btn) { btn.disabled = false; }
        });
      } catch (e) {
        hideLoader();
        showError('Error: ' + e.message);
      }
    };

    window.processFeePayment = async function (feeIdx) {
      try {
        const u = JSON.parse(sessionStorage.getItem('Uni_user') || 'null');
        const amtEl = document.getElementById('pay-amt');
        const amount = parseInt(amtEl?.value || 0);
        const method = document.getElementById('pay-method')?.value || 'Online';
        const ref = document.getElementById('pay-ref')?.value || '';

        if (!amount || amount <= 0) {
          showError('Enter valid amount', amtEl);
          return;
        }

        const fees = window.DB_FEES || [];
        const fee = fees[feeIdx];
        if (!fee) {
          showError('Fee record not found');
          return;
        }

        showLoader();
        const btn = document.querySelector('.modal .btn-teal');
        if (btn) { btn.disabled = true; btn.textContent = 'Processing...'; }

        const r = await fetch(`${API_BASE_URL}/student/${encodeURIComponent(u.id)}/pay-fee`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fee_id: fee.id, amount, method, reference: ref })
        });

        const d = await r.json();

          fee.status = d.status;
          closeModal();
          document.getElementById('page-content').innerHTML = pageFees();
          showToast('✅ Payment recorded successfully!');

        }

        icon.className = `fa-solid ${iconTypes[Math.floor(Math.random() * iconTypes.length)]} chalk-icon`;
        const xPos = (c * (100 / cols)) + (Math.random() * 5);
        const yPos = (r * (100 / rows)) + (Math.random() * 5);
        icon.style.left = `${xPos}%`;
        icon.style.top = `${yPos}%`;
        icon.style.fontSize = `${18 + Math.random() * 20}px`;
        icon.style.opacity = '0.4';
        board.appendChild(icon);
        icons.push({ el: icon, x: 0, y: 0, vx: 0, vy: 0 });
      }
    }

    let mX = window.innerWidth / 2, mY = window.innerHeight / 2;
    document.addEventListener('mousemove', e => {
      mX = e.clientX; mY = e.clientY;
      glow.style.left = `${mX}px`;
      glow.style.top = `${mY}px`;
    });

    function animateChalk() {
      icons.forEach(icon => {
        const rect = icon.el.getBoundingClientRect();
        const iX = rect.left + rect.width / 2;
        const iY = rect.top + rect.height / 2;
        const dx = mX - iX, dy = mY - iY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 200) {
          const angle = Math.atan2(dy, dx);
          const force = (200 - dist) / 200;
          icon.vx -= Math.cos(angle) * force * 5;
          icon.vy -= Math.sin(angle) * force * 5;
          icon.el.style.color = 'rgba(180, 180, 255, 0.95)';
          icon.el.style.opacity = '1';
          icon.el.style.filter = 'drop-shadow(0 0 12px rgba(99, 102, 241, 0.9))';
        } else {
          icon.el.style.color = 'rgba(255, 255, 255, 0.35)';
          icon.el.style.opacity = '0.4';
          icon.el.style.filter = 'drop-shadow(0 0 5px rgba(255, 255, 255, 0.1))';
        }
        icon.vx *= 0.9;
        icon.vy *= 0.9;
        icon.x += icon.vx;
        icon.y += icon.vy;
        icon.x *= 0.95;
        icon.y *= 0.95;
        icon.el.style.transform = `translate(${icon.x}px, ${icon.y}px)`;
      });
      requestAnimationFrame(animateChalk);
    }
    animateChalk();

    /* ── BACKEND CONFIG ── */
    const API_BASE_URL = '/api';

    /* ── AUTH GUARD & NAME INJECTION ── */
    (async function () {
      const u = JSON.parse(sessionStorage.getItem('Uni_user') || 'null');
      if (!u || u.role !== 'Student') { window.top.location.href = '/'; return; }
      const initials = u.name.split(' ').map(x => x[0]).join('').slice(0, 2).toUpperCase();
      document.getElementById('sb-av').textContent = initials;
      document.getElementById('sb-name').textContent = u.name;
      document.getElementById('tb-name').textContent = u.name.split(' ')[0];

      /* Init notification badge & load notifications from API */
      updateNotifBadge();
      loadNotifications(); // Fetch notifications from backend

      /* Fetch live student data from backend */
      try {
        const resp = await fetch(`${API_BASE_URL}/student/${encodeURIComponent(u.id)}`);
        const data = await resp.json();
        if (data.ok) {
          const s = data.student;
          /* Update displayed name & initials from DB */
          const dbInitials = s.name.split(' ').map(x => x[0]).join('').slice(0, 2).toUpperCase();
          document.getElementById('sb-av').textContent = dbInitials;
          document.getElementById('sb-name').textContent = s.name;
          document.getElementById('tb-name').textContent = s.name.split(' ')[0];

          /* Store enriched session */
          sessionStorage.setItem('Uni_user', JSON.stringify({
            ...u, ...s, role: 'Student',
            classes: data.classes
          }));

          /* Expose for dashboard rendering */
          window.DB_STUDENT = s;
          window.DB_CLASSES = data.classes;

          /* If student has DB classes, set up SUBJECTS from them */
          if (data.classes && data.classes.length > 0) {
            const colors = ['#0d9488', '#7c3aed', '#e8a020', '#c41e3a', '#10b981', '#6366f1', '#f59e0b'];
            SUBJECTS = data.classes.map((c, i) => ({
              id: c.id,
              name: c.name,
              code: c.subject_code,
              teacher: c.teacher_name,
              att: Math.max(60, Math.min(98, Math.round((s.attendance || 80) + (Math.random() * 8 - 4)))),
              total: 40 + (i * 3 % 10),
              present: Math.round((40 + (i * 3 % 10)) * ((s.attendance || 80) / 100)),
              color: colors[i % colors.length]
            }));
          } else if (data.classes && data.classes.length === 0) {
            // New student with no enrollments — show empty state
            SUBJECTS = [];
            ASSIGNMENTS = [];
          }
        }
      } catch (e) {
        console.warn('Backend unavailable, using session data:', e.message);
      }

      /* ── Real-time chat via Socket.IO ── */
      let _stuSocket = null, _stuActiveRoom = null, _stuChatContacts = [];
      try {
        _stuSocket = io(window.location.origin);

        // Listen for new notifications
        _stuSocket.on('notification', (data) => {
          if (data.user_id === u.id && data.user_role === 'Student') {
            // Add to notifications
            if (!NOTIFICATIONS) NOTIFICATIONS = [];
            NOTIFICATIONS.unshift({
              title: data.title,
              body: data.body || '',
              tag: data.category || 'general',
              read: 0,
              date: new Date().toLocaleDateString()
            });
            updateNotifBadge();
            showToast(`📬 ${data.title}`);
            // Auto-refresh if on notifications page
            const content = document.getElementById('page-content');
            if (content && content.innerHTML.includes('Announcements')) {
              setTimeout(() => {
                content.innerHTML = pageAnnouncements();
              }, 500);
            }
          }
        });

        // Listen for marks updates
        _stuSocket.on('marks_updated', (data) => {
          if (data.student_id === u.id) {
            // Refresh marks from API
            fetch(`${API_BASE_URL}/student/${encodeURIComponent(u.id)}/marks`)
              .then(r => r.json())
              .then(d => {
                if (d.ok) {
                  window.DB_MARKS = d.marks;
                  showToast('📊 Your marks have been updated!');
                  // Refresh if on grades page
                  const content = document.getElementById('page-content');
                  if (content && content.innerHTML.includes('Grade')) {
                    setTimeout(() => { content.innerHTML = pageGrades(); }, 500);
                  }
                }
              });
          }
        });

        // Listen for attendance updates
        _stuSocket.on('attendance_updated', (data) => {
          if (data.student_id === u.id) {
            fetch(`${API_BASE_URL}/student/${encodeURIComponent(u.id)}/attendance`)
              .then(r => r.json())
              .then(d => {
                if (d.ok) {
                  window.DB_ATTENDANCE = d.classes;
                  window.DB_OVERALL_ATTENDANCE = Math.round(d.overall_pct);
                  showToast('✓ Attendance updated!');
                }
              });
          }
        });

        _stuSocket.on('receive_message', (data) => {
          if (data.room_id !== _stuActiveRoom) return;
          const msgsEl = document.getElementById('chat-msgs');
          const u2 = JSON.parse(sessionStorage.getItem('Uni_user') || 'null');
          if (msgsEl) {
            msgsEl.innerHTML += `<div class="cmsg ${data.sender_id === u2?.id ? 'cm-me' : 'cm-them'}">${data.text}<div style="font-size:.58rem;color:rgba(255,255,255,.3);margin-top:2px">${data.sender_name}</div></div>`;
            msgsEl.scrollTop = msgsEl.scrollHeight;
          }
        });
      } catch (e) {
        console.warn('Socket not available');
      }

      /* Load contacts from API (includes peer students now) */
      try {
        const cr = await fetch(`${API_BASE_URL}/chat/contacts/${encodeURIComponent(u.id)}/Student`);
        const cd = await cr.json();
        if (cd.ok) _stuChatContacts = cd.contacts;
      } catch (e) { }

      /* Fetch marks and attendance data from backend */
      try {
        const [marksResp, attResp, feesResp] = await Promise.all([
          fetch(`${API_BASE_URL}/student/${encodeURIComponent(u.id)}/marks`),
          fetch(`${API_BASE_URL}/student/${encodeURIComponent(u.id)}/attendance`),
          fetch(`${API_BASE_URL}/student/${encodeURIComponent(u.id)}/fees`)
        ]);
        const marksData = await marksResp.json();
        const attData = await attResp.json();
        const feesData = await feesResp.json();

        // Store marks and attendance for display
        window.DB_MARKS = marksData.ok ? marksData.marks : [];
        window.DB_ATTENDANCE = attData.ok ? attData.classes : [];
        window.DB_FEES = feesData.ok ? feesData.fees : [];
        window.DB_OVERALL_ATTENDANCE = attData.ok ? Math.round(attData.overall_pct) : 0;
      } catch (e) { console.warn('Could not fetch marks/attendance/fees'); }

      /* Override pageChat to use real API contacts with grouped sections */
      window.pageChat = function () {
        const contacts = _stuChatContacts.length ? _stuChatContacts : [
          { id: 'default', name: 'Support', role_label: 'Uni Admin', role: 'Admin' }
        ];
        const teachers = contacts.filter(c => c.role === 'Teacher');
        const peers = contacts.filter(c => c.role === 'Student');
        const admins = contacts.filter(c => c.role === 'Admin');

        function contactItem(c, i) {
          const icon = c.role === 'Teacher' ? 'fa-chalkboard-user' : c.role === 'Student' ? 'fa-user-graduate' : 'fa-shield-halved';
          const clr = c.role === 'Teacher' ? '#2dd4bf' : c.role === 'Student' ? '#a78bfa' : '#6366f1';
          return `<div class="chat-si" id="scsi-${i}" onclick="stuOpenChat(${i})">
            <div style="display:flex;align-items:center;gap:8px">
              <div style="width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:.8rem;flex-shrink:0;color:${clr}"><i class="fa-solid ${icon}"></i></div>
              <div style="flex:1;min-width:0">
                <div class="chat-sn">${c.name}</div>
                <div class="chat-sp">${c.role_label}</div>
              </div>
            </div>
          </div>`;
        }

        function section(label, items, startIdx) {
          if (items.length === 0) return '';
          return `<div style="padding:6px 12px 2px;font-size:.58rem;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:1.2px">${label}</div>
            ${items.map((c, i) => contactItem(c, startIdx + i)).join('')}`;
        }

        return `<div class="panel" style="height:calc(100vh - 115px)">
          <div class="chat-layout">
            <div class="chat-left">
              <div style="padding:10px 12px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:space-between;gap:8px">
                <div style="font-size:.62rem;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:1px">Messages</div>
                <button class="btn btn-admin btn-xs" onclick="stuCreateNewChat()" title="Start new conversation">
                  <i class="fa-solid fa-plus" style="margin-right:3px"></i>New
                </button>
              </div>
              ${section('Faculty', teachers, 0)}
              ${section('Classmates', peers, teachers.length)}
              ${section('Admin', admins, teachers.length + peers.length)}
              ${contacts.length === 0 ? '<div style="padding:20px;text-align:center;color:var(--muted);font-size:.75rem">No contacts found</div>' : ''}
            </div>
            <div class="chat-main" id="stu-chat-main">
              <div style="flex:1;display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);opacity:.4">
                <div style="text-align:center"><i class="fa-solid fa-comments" style="font-size:2rem;margin-bottom:8px;display:block"></i>Select a contact to start chatting</div>
              </div>
            </div>
          </div>
        </div>`;
      };
      // Update PAGES map with real contacts
      PAGES['chat'] = window.pageChat;

      window.stuOpenChat = async function (i) {
        const contacts = _stuChatContacts.length ? _stuChatContacts : [{ id: 'Admin@404', name: 'Support', role_label: 'Uni Admin', role: 'Admin' }];
        const c = contacts[i];
        if (!c) return;
        document.querySelectorAll('.chat-si').forEach((el, j) => el.classList.toggle('active', j === i));
        const u2 = JSON.parse(sessionStorage.getItem('Uni_user') || 'null');
        const roomId = [u2.id, c.id].sort().join('_');
        _stuActiveRoom = roomId;
        if (_stuSocket) _stuSocket.emit('join_room', roomId);
        const chatMain = document.getElementById('stu-chat-main');
        if (!chatMain) return;
        chatMain.innerHTML = `
          <div class="chat-hdr">
            <div style="width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:.85rem;color:var(--muted)">
              <i class="fa-solid ${c.role === 'Teacher' ? 'fa-chalkboard-user' : c.role === 'Student' ? 'fa-user-graduate' : 'fa-shield-halved'}"></i>
            </div>
            <div><div style="font-weight:700;font-size:.84rem">${c.name}</div><div style="font-size:.68rem;color:var(--muted)">${c.role} · ${c.role_label}</div></div>
          </div>
          <div class="chat-msgs" id="chat-msgs"><div style="text-align:center;color:var(--muted);font-size:.75rem;margin:20px"><i class="fa-solid fa-spinner fa-spin"></i></div></div>
          <div class="chat-inp">
            <input class="inp" style="flex:1" id="chat-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMsg()">
            <button class="btn btn-white btn-sm" onclick="sendMsg()"><i class="fa-solid fa-paper-plane" style="margin-right:4px"></i>Send</button>
          </div>`;
        // Load history
        try {
          const hr = await fetch(`${API_BASE_URL}/chat/messages/${encodeURIComponent(roomId)}`);
          const hd = await hr.json();
          const msgsEl = document.getElementById('chat-msgs');
          if (msgsEl && hd.ok) {
            if (hd.messages.length === 0) {
              msgsEl.innerHTML = '<div style="text-align:center;color:var(--muted);font-size:.75rem;padding:20px">No messages yet</div>';
            } else {
              msgsEl.innerHTML = hd.messages.map(m => `<div class="cmsg ${m.sender_id === u2?.id ? 'cm-me' : 'cm-them'}">${m.text}<div style="font-size:.58rem;color:rgba(255,255,255,.3);margin-top:2px">${m.sender_name}</div></div>`).join('');
              msgsEl.scrollTop = msgsEl.scrollHeight;
            }
          }
        } catch (e) { }
      };

      /**
       * Create a new chat by selecting a contact
       * Shows a dialog with available contacts to start a conversation
       */
      window.stuCreateNewChat = async function () {
        const contacts = _stuChatContacts.length ? _stuChatContacts : [{ id: 'default', name: 'Support', role_label: 'Uni Admin', role: 'Admin' }];
        const u2 = JSON.parse(sessionStorage.getItem('Uni_user') || 'null');

        // Create contact selection dialog
        const dialogHtml = `
          <div class="modal-bg" id="new-chat-dialog" onclick="if(event.target.id==='new-chat-dialog') document.getElementById('new-chat-dialog').remove()">
            <div class="modal" style="width:420px;max-width:95vw">
              <div class="modal-t"><i class="fa-solid fa-pen-to-square" style="margin-right:8px;color:var(--admin)"></i>Start New Chat</div>
              <div style="border-bottom:1px solid rgba(255,255,255,0.08);padding:12px 16px;font-size:.7rem;color:var(--muted)">Select a contact to message</div>
              <div style="max-height:400px;overflow-y:auto;padding:8px 0">
                ${contacts.map((c, idx) => `
                  <div class="li" style="margin:0;padding:12px 16px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.04)" onclick="stuSelectContactForChat(${idx})">
                    <div style="width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;color:${c.role === 'Teacher' ? '#2dd4bf' : c.role === 'Student' ? '#a78bfa' : '#6366f1'};font-size:.9rem;flex-shrink:0">
                      <i class="fa-solid ${c.role === 'Teacher' ? 'fa-chalkboard-user' : c.role === 'Student' ? 'fa-user-graduate' : 'fa-shield-halved'}"></i>
                    </div>
                    <div style="flex:1;">
                      <div style="font-weight:600;font-size:.8rem">${c.name}</div>
                      <div style="font-size:.68rem;color:var(--muted)">${c.role_label}</div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>`;

        document.body.insertAdjacentHTML('beforeend', dialogHtml);
      };

      /**
       * Select a contact and create/open chat with them
       */
      window.stuSelectContactForChat = async function (idx) {
        const contacts = _stuChatContacts.length ? _stuChatContacts : [{ id: 'default', name: 'Support', role_label: 'Uni Admin', role: 'Admin' }];
        const contact = contacts[idx];
        const u2 = JSON.parse(sessionStorage.getItem('Uni_user') || 'null');

        // Remove dialog
        const dialog = document.getElementById('new-chat-dialog');
        if (dialog) dialog.remove();

        // Call backend to create/get chat
        try {
          const resp = await fetch(`${API_BASE_URL}/chat/create`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              user1_id: u2.id,
              user2_id: contact.id,
              user1_name: u2.name,
              user2_name: contact.name,
              user1_role: 'Student',
              user2_role: contact.role
            })
          });
          const data = await resp.json();
          if (data.ok) {
            showToast('✓ Chat opened successfully');
            // Open the chat
            stuOpenChat(idx);
          } else {
            showToast('Failed to create chat', 'error');
          }
        } catch (e) {
          console.error('Chat create error:', e);
          showToast('Error creating chat', 'error');
        }
      };

      /* Override sendMsg for real-time */
      window.sendMsg = function () {
        const inp = document.getElementById('chat-input');
        const text = inp?.value?.trim();
        if (!text) return;
        const u3 = JSON.parse(sessionStorage.getItem('Uni_user') || 'null');
        if (_stuSocket && _stuActiveRoom) {
          _stuSocket.emit('send_message', {
            room_id: _stuActiveRoom,
            sender_id: u3.id,
            sender_name: u3.name,
            sender_role: 'Student',
            text
          });
          inp.value = '';
        } else {
          // Fallback: show message locally
          const msgsEl = document.getElementById('chat-msgs');
          if (msgsEl) {
            msgsEl.innerHTML += `<div class="cmsg cm-me">${text}</div>`;
            msgsEl.scrollTop = msgsEl.scrollHeight;
          }
          inp.value = '';
        }
      };

      /* Render dashboard after data fetch */
      document.getElementById('page-content').innerHTML = pageDashboard();
      bindPageEvents('dashboard');

      // Initialize badge counts on page load
      initBadges();
    })();

    function doLogout() { sessionStorage.removeItem('Uni_user'); window.top.location.href = '/'; }

    /* ── GLOBAL SEARCH ── */
    function globalSearch(q) {
      q = q.toLowerCase().trim();
      if (!q) {
        document.querySelectorAll('.li, .gcard, tbody tr').forEach(el => el.style.display = '');
        return;
      }
      document.querySelectorAll('.li').forEach(el => {
        el.style.display = el.textContent.toLowerCase().includes(q) ? '' : 'none';
      });
      document.querySelectorAll('tbody tr').forEach(el => {
        el.style.display = el.textContent.toLowerCase().includes(q) ? '' : 'none';
      });
    }

    /* ── INIT – handled by async auth guard above ── */
  </script>
</body>

</html>
